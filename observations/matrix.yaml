# Observation matrix: one entry per case in datasets/manifest.json.
# Filled by hand after each run (see observations/TEMPLATE.md). The dashboard
# reads this file via scripts/build_dashboard.py; nothing here is computed.
#
# Leave status: pending until the case has actually been run in Rhombus.
# Allowed values (anything else is shown as-is with a warning in the build):
#   status              pending | done
#   rhombus_status      Success | Failure
#   platform_behaviour  stopped | warned | carried_on
#   gcs_output          yes | no
#   logs_clear          clear | partial | misleading
#   chatbot_diagnosis   correct | partial | wrong | na
#   chatbot_fix_worked  yes | no | na
#   severity            Critical | High | Medium | Low | na
#   execution_seconds   number, from Rhombus run history (run start to finish)
#   credits_used        number, from the Rhombus credits page
#   capability          optional override: handled | warned | broke | missed
#                       (otherwise derived, see dashboard/README.md)
#   headline            one plain sentence for the dashboard case card
#   evidence_keywords   optional: words matched against observations/evidence file
#                       names (default: the case slug minus its group prefix)
#   extra_md            optional: more markdown files shown on the case page
#
# The summary section at the end of this file feeds the dashboard home page
# (verdict, required cases, credits, learnings).

